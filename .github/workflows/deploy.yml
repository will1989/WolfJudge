name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # deploy-pages@v4 需要通过 Actions API 查询 github-pages artifact 元数据；
  # 一旦声明 permissions 块，未列出的权限默认为 none，故必须显式加上 actions: read
  # （GitHub 官方 issue actions/deploy-pages#285）
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 整个仓库根目录即为静态站点（index.html / manifest / sw.js / icon.svg）
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
